<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTTP：分批接收与缓存验证</title>
<style>
:root{color-scheme:light dark;--bg:#f6f4ee;--fg:#202b32;--panel:#ffffff;--line:#b6c5cb;--accent:#075c69}
@media(prefers-color-scheme:dark){:root{--bg:#182027;--fg:#e6edf1;--panel:#212f38;--line:#667985;--accent:#8fdae4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 system-ui,"Microsoft YaHei",sans-serif}main{max-width:850px;margin:auto;padding:32px 20px}h1{font-size:1.7rem;line-height:1.5}a{color:var(--accent)}label{display:block}select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px}select{width:100%;margin:8px 0 18px}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:300px}h2{font-size:1.3rem;margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;border-left:4px solid var(--accent);padding:10px 14px;background:var(--bg)}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.note{border-top:1px solid var(--line);padding-top:10px}#count{font-variant-numeric:tabular-nums}footer{margin-top:26px}@media(max-width:450px){main{padding:18px 12px}article{padding:14px;min-height:340px}h1{font-size:1.4rem}}
</style></head>
<body><main><p>计算机网络 · 配套推演</p><h1>HTTP：分批接收与缓存验证</h1><p>先预测下一步，再点按钮。这里追踪的是 HTTP 正文，不是 TCP 段。</p>
<label for="scenario">情境</label><select id="scenario"><option value="0">正文分两次到达</option><option value="1">缓存 v7 后进行验证</option></select>
<article aria-live="polite" aria-atomic="true"><p id="count"></p><h2 id="stage"></h2><pre id="state"></pre><p id="action"></p><p class="note" id="invariant"></p></article>
<nav aria-label="推演控制"><button id="reset">重置</button><button id="prev">上一步</button><button id="next">下一步</button></nav>
<footer><a href="29_HTTP_通用请求与响应.md">返回正文（也可在 Obsidian 中打开同名文档）</a><p>这是有限情境的教学演示，不会连接真实服务器。到最后一步后可重置或选择其他情境。</p></footer>
<noscript>此演示需要 JavaScript。完整解释已保存在同目录的 Markdown 正文中。</noscript></main>
<script>
"use strict";
const scenarios = [{"name":"正文分两次到达","states":[["首部已读完","Content-Length = 12；已收正文 = 0 字节","解析器等待正文，暂不能交付完整 JSON。","一次读取的长度不决定消息边界。"],["第一次读到 5 字节","正文缓冲 = {\"roo；已收 = 5 / 12","还差 7 字节，继续等待。","不得把局部正文当成完整结果。"],["第二次读到 7 字节","正文缓冲 = {\"rooms\":[]}；已收 = 12 / 12","本例正文完整，可以交给 JSON 解析与业务逻辑。","这仍然是一份 HTTP 响应，而不是两份。"]]},{"name":"缓存 v7 后进行验证","states":[["本机已有旧正文","缓存版本 = v7；缓存正文存在；当前已过新鲜期","客户端不能仅凭有副本就当作最新。","DNS 缓存与 HTTP 正文缓存是两类缓存。"],["发送条件请求","If-None-Match: \"v7\"","询问服务端当前表示是否仍与 v7 匹配。","请求通过 HTTP 表达条件，不是 TCP ACK。"],["服务端版本未变","HTTP 状态 = 304；未重新传整份正文","客户端复用已有缓存正文，并按响应更新缓存信息。","304 不会凭空产生客户端原本没有的正文。"]]}];
let scenarioIndex = 0;
let stepIndex = 0;
const ids = ["scenario","count","stage","state","action","invariant","reset","prev","next"];
const elements = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
function render() {
  const states = scenarios[scenarioIndex].states;
  const state = states[stepIndex];
  elements.count.textContent = "步骤 " + (stepIndex + 1) + " / " + states.length;
  elements.stage.textContent = state[0];
  elements.state.textContent = state[1];
  elements.action.textContent = "发生的事：" + state[2];
  elements.invariant.textContent = "应保持的判断：" + state[3];
  elements.prev.disabled = stepIndex === 0;
  elements.next.disabled = stepIndex === states.length - 1;
}
elements.scenario.addEventListener("change", () => { scenarioIndex = Number(elements.scenario.value); stepIndex = 0; render(); });
elements.reset.addEventListener("click", () => { stepIndex = 0; render(); });
elements.prev.addEventListener("click", () => { stepIndex = Math.max(0, stepIndex - 1); render(); });
elements.next.addEventListener("click", () => { stepIndex = Math.min(scenarios[scenarioIndex].states.length - 1, stepIndex + 1); render(); });
render();
</script></body></html>
